apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes
  namespace: notes
  labels:
    app: notes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes
  template:
    metadata:
      labels:
        app: notes
    spec:
      automountServiceAccountToken: false   # the app never talks to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notes
          image: tp-devsecops:hardened
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            # secrets injected from the Secret object, never written in the image or in Git
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notes-secrets
                  key: admin-password
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: notes-secrets
                  key: secret-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data          # the only writable path: the SQLite file
              mountPath: /app/data
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: notes
  namespace: notes
spec:
  selector:
    app: notes
  ports:
    - port: 80
      targetPort: 8000
