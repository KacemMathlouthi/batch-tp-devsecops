[project]
name = "tp-devsecops"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.27.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.34",
    "pyyaml==6.0.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "httpx==0.27.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
