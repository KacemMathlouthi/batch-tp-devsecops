name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/kacemmathlouthi/batch-tp-devsecops

jobs:
  # ── 1. Build and unit tests ─────────────────────────────────────────
  test:
    name: build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.7.20"
          python-version: "3.12"

      - name: install dependencies (uv.lock)
        run: uv sync --frozen

      - name: unit tests
        run: uv run pytest -v

      - name: build image
        run: docker build -t tp-devsecops:${{ github.sha }} .

  # ── 2. SAST: Bandit, blocks on High severity ────────────────────────
  sast:
    name: sast (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: full report (all severities, never fails)
        run: |
          mkdir -p reports && chmod 777 reports
          docker run --rm -v "$PWD/app":/src -v "$PWD/reports":/out ghcr.io/pycqa/bandit/bandit \
            -r /src -x /src/.venv,/src/tests -f json -o /out/bandit.json --exit-zero

      - name: security gate (fails on High)
        run: |
          docker run --rm -v "$PWD/app":/src ghcr.io/pycqa/bandit/bandit \
            -r /src -x /src/.venv,/src/tests --severity-level high

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-report
          path: reports/

  # ── 3. SCA: Snyk, blocks on High or Critical ────────────────────────
  sca:
    name: sca (snyk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: full report (all severities, never fails)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          mkdir -p reports
          docker run --rm -e SNYK_TOKEN -v "$PWD/app":/project -w /project snyk/snyk:python-3.12 \
            snyk test --json > reports/snyk.json || true
          rm -f app/poetry.lock

      - name: security gate (fails on High or Critical)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          docker run --rm -e SNYK_TOKEN -v "$PWD/app":/project -w /project snyk/snyk:python-3.12 \
            snyk test --severity-threshold=high

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: snyk-report
          path: reports/

  # ── 4. DAST: ephemeral environment + OWASP ZAP, blocks on High ──────
  dast:
    name: dast (zap)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: deploy ephemeral environment
        run: |
          docker build -t tp-devsecops:${{ github.sha }} app
          docker network create dast
          # throwaway secrets, generated for this run only
          docker run -d --name target --network dast \
            -e ADMIN_PASSWORD="$(openssl rand -hex 16)" -e SECRET_KEY="$(openssl rand -hex 32)" \
            tp-devsecops:${{ github.sha }}
          for i in $(seq 30); do
            docker run --rm --network dast curlimages/curl:8.11.1 -sf http://target:8000/healthz && exit 0
            sleep 1
          done
          docker logs target; exit 1

      - name: zap api scan (OpenAPI)
        run: |
          mkdir -p reports && chmod 777 reports
          docker run --rm --network dast -v "$PWD/reports":/zap/wrk:rw ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t http://target:8000/openapi.json -f openapi \
            -J zap.json -r zap.html -w zap.md -I

      - name: security gate (fails on High risk)
        run: |
          jq -r '.site[].alerts[] | "\(.riskdesc)\t\(.alert)\t\(.instances | length)"' reports/zap.json | sort -r
          high=$(jq '[.site[].alerts[] | select(.riskcode == "3")] | length' reports/zap.json)
          echo "High risk alerts: $high"
          if [ "$high" -gt 0 ]; then
            jq -r '.site[].alerts[] | select(.riskcode == "3") | "::error title=ZAP High::\(.alert) on \(.instances[0].uri)"' reports/zap.json
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-report
          path: reports/

      - name: tear down ephemeral environment
        if: always()
        run: docker rm -f target && docker network rm dast

  # ── 5. Image scan: Trivy, blocks on High or Critical (TP3) ──────────
  image-scan:
    name: image scan (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: build image
        run: docker build -t tp-devsecops:${{ github.sha }} app

      - name: dockerfile misconfigurations (fails on High or Critical)
        run: |
          docker run --rm -v "$PWD/app":/src aquasec/trivy:0.76.2 \
            config --exit-code 1 --severity HIGH,CRITICAL /src/Dockerfile

      - name: image vulnerabilities (fails on High or Critical)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2 \
            image --exit-code 1 --severity HIGH,CRITICAL tp-devsecops:${{ github.sha }}

  # ── 6. Publish: only on main, only if every gate passed ─────────────
  publish:
    name: publish image
    runs-on: ubuntu-latest
    needs: [test, sast, sca, dast, image-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: login to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: build and push
        run: |
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest app
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
