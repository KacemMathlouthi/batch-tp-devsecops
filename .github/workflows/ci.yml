name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.20"
          python-version: "3.12"

      - name: install dependencies (uv.lock)
        run: uv sync --frozen

      - name: unit tests
        run: uv run pytest -v

      - name: build image
        run: docker build -t tp-devsecops:${{ github.sha }} .
